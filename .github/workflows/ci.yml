name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            cc: gcc
            cxx: g++
          - compiler: clang++
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Run test suite
        run: ./scripts/run_all.sh

      # Pins the IR each pass emits. The differential gate below proves
      # behaviour is unchanged; this catches a pass that quietly stops
      # firing or changes shape while still computing the same answer.
      - name: Golden-IR regression
        run: ./scripts/golden.sh

      # Timing budgets with wide margins — see the header of perf.sh for
      # why the 3000-line optimizer case is allowed far more than it needs.
      - name: Performance and scalability
        run: ./scripts/perf.sh

      # Enabled from Review 2 Step 6, now that the interpreter and the
      # optimizer exist (P1-P3 as of Step 6, all of P1-P9 as of Review 3).
      # This is the gate that makes optimization safe: the unoptimized and
      # optimized programs must produce byte-identical output, both for
      # the full pipeline and for every pass enabled completely alone.
      - name: Differential-execution gate
        run: ./scripts/differential.sh
